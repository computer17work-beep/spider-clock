<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animated Spider Clock Widget</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@700&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: 'Caveat', cursive, sans-serif;
    }

    #watch {
      position: relative;
      width: 320px;
      height: 320px;
      background: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    svg.gear-layer {
      position: absolute;
      width: 100%;
      height: 100%;
      overflow: visible;
      opacity: 0.35;
      z-index: 1;
    }

    /* গিয়ার ঘোরার অ্যানিমেশন (Gears Rotation) */
    @keyframes spinClockwise {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes spinCounterClockwise {
      from { transform: rotate(0deg); }
      to { transform: rotate(-360deg); }
    }

    .gear-1 {
      transform-origin: 125px 125px;
      animation: spinClockwise 25s linear infinite;
    }
    .gear-2 {
      transform-origin: 195px 125px;
      animation: spinCounterClockwise 25s linear infinite;
    }
    .gear-3 {
      transform-origin: 160px 185px;
      animation: spinClockwise 20s linear infinite;
    }

    /* ফন্ট এবং ডায়ালের সংখ্যা (Numbers) */
    .dial-number {
      position: absolute;
      font-size: 32px;
      font-weight: 700;
      color: #333333;
      z-index: 2;
      user-select: none;
    }

    /* নিখুঁত ১২ কোণের পজিশনিং */
    .n12 { top: 10px; left: 50%; transform: translateX(-50%); }
    .n1  { top: 25px; right: 80px; }
    .n2  { top: 65px; right: 35px; }
    .n3  { top: 50%; right: 18px; transform: translateY(-50%); }
    .n4  { bottom: 65px; right: 35px; }
    .n5  { bottom: 25px; right: 80px; }
    .n6  { bottom: 10px; left: 50%; transform: translateX(-50%); }
    .n7  { bottom: 25px; left: 80px; }
    .n8  { bottom: 65px; left: 35px; }
    .n9  { top: 50%; left: 18px; transform: translateY(-50%); }
    .n10 { top: 65px; left: 35px; }
    .n11 { top: 25px; left: 80px; }

    /* মাকড়সা এবং কাঁটার লেয়ার */
    .spider-container {
      position: absolute;
      width: 100%;
      height: 100%;
      z-index: 5;
      pointer-events: none;
    }

    .spider-body {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 60px;
      height: 60px;
      z-index: 10;
    }

    /* নড়াচড়া করা পায়ের অ্যানিমেশন */
    @keyframes legWiggleLeft {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-12deg); }
    }
    @keyframes legWiggleRight {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(12deg); }
    }

    .wiggle-left {
      transform-origin: 25px 30px;
      animation: legWiggleLeft 1.2s infinite ease-in-out;
    }
    .wiggle-right {
      transform-origin: 35px 30px;
      animation: legWiggleRight 1.2s infinite ease-in-out;
    }

    /* ঘণ্টা ও মিনিটের কাঁটা (লম্বা দুটি পা) */
    .hand-holder {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    .hour-hand-leg {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 3px;
      height: 80px;
      background: #000000;
      transform-origin: top center;
      border-radius: 2px 2px 5px 5px;
      margin-left: -1.5px;
    }

    .minute-hand-leg {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 2.5px;
      height: 110px;
      background: #000000;
      transform-origin: top center;
      border-radius: 2px 2px 5px 5px;
      margin-left: -1.25px;
    }
  </style>
</head>
<body>

  <div id="watch">
    <!-- ৩টি ঘূর্ণায়মান স্পাইডার গিয়ার (Spider Gears) -->
    <svg class="gear-layer" viewBox="0 0 320 320">
      <defs>
        <g id="gear">
          <circle cx="0" cy="0" r="22" fill="none" stroke="#222" stroke-width="1.2" stroke-dasharray="3,3"/>
          <circle cx="0" cy="0" r="15" fill="none" stroke="#222" stroke-width="1"/>
          <!--ギア Cogs -->
          <path d="M-2,-25 L2,-25 L3,-20 L-3,-20 Z M-2,25 L2,25 L3,20 L-3,20 Z M-25,-2 L-25,2 L-20,3 L-20,-3 Z M25,-2 L25,2 L20,3 L20,-3 Z" fill="#222"/>
          <path d="M-17,-17 L-14,-20 L-11,-15 L-15,-12 Z M17,17 L14,20 L11,15 L15,12 Z M-17,17 L-20,14 L-15,11 L-12,15 Z M17,-17 L20,-14 L15,-11 L12,-15 Z" fill="#222"/>
        </g>
      </defs>

      <!-- ব্যাকগ্রাউন্ড জালের গিয়ার অবস্থান -->
      <g class="gear-1" transform="translate(125, 125)"><use href="#gear"/></g>
      <g class="gear-2" transform="translate(195, 125)"><use href="#gear"/></g>
      <g class="gear-3" transform="translate(160, 185)"><use href="#gear" transform="scale(1.3)"/></g>
    </svg>

    <!-- ১ থেকে ১২ নম্বর (Handmade Font Style) -->
    <span class="dial-number n12">12</span>
    <span class="dial-number n1">1</span>
    <span class="dial-number n2">2</span>
    <span class="dial-number n3">3</span>
    <span class="dial-number n4">4</span>
    <span class="dial-number n5">5</span>
    <span class="dial-number n6">6</span>
    <span class="dial-number n7">7</span>
    <span class="dial-number n8">8</span>
    <span class="dial-number n9">9</span>
    <span class="dial-number n10">10</span>
    <span class="dial-number n11">11</span>

    <!-- ঘণ্টার কাঁটা (Hour Hand as Spider Leg) -->
    <div class="hand-holder" id="hourHand">
      <div class="hour-hand-leg"></div>
    </div>

    <!-- মিনিটের কাঁটা (Minute Hand as Spider Leg) -->
    <div class="hand-holder" id="minuteHand">
      <div class="minute-hand-leg"></div>
    </div>

    <!-- মাকড়সার বডি ও ছোট নড়াচড়াকারী পা সমূহ -->
    <div class="spider-container">
      <svg class="spider-body" viewBox="0 0 60 60">
        <!-- সেন্ট্রাল বডি -->
        <ellipse cx="30" cy="30" rx="4.5" ry="8" fill="#000" />
        <circle cx="30" cy="21" r="3.5" fill="#000" />

        <!-- ওপরের বাঁকানো ছোট পা ৪টি -->
        <path d="M 28 23 C 18 12 8 20 5 22" stroke="#000" stroke-width="1.8" fill="none" stroke-linecap="round"/>
        <path d="M 32 23 C 42 12 52 20 55 22" stroke="#000" stroke-width="1.8" fill="none" stroke-linecap="round"/>

        <!-- পাশের অ্যানিমেটেড পা ২টি -->
        <path class="wiggle-left" d="M 26 28 C 12 30 5 45 3 50" stroke="#000" stroke-width="1.8" fill="none" stroke-linecap="round"/>
        <path class="wiggle-right" d="M 34 28 C 48 30 55 45 57 50" stroke="#000" stroke-width="1.8" fill="none" stroke-linecap="round"/>
      </svg>
    </div>
  </div>

  <script>
    function updateSpiderClock() {
      const now = new Date();
      const secs = now.getSeconds();
      const mins = now.getMinutes();
      const hours = now.getHours();

      // কাঁটাগুলোর আসল সময় অনুযায়ী সঠিক কোণ (Degrees) নির্ণয়
      const minDeg = ((mins + secs / 60) / 60) * 360 + 180;
      const hourDeg = ((hours % 12 + mins / 60) / 12) * 360 + 180;

      document.getElementById('minuteHand').style.transform = `rotate(${minDeg}deg)`;
      document.getElementById('hourHand').style.transform = `rotate(${hourDeg}deg)`;
    }

    setInterval(updateSpiderClock, 1000);
    updateSpiderClock();
  </script>
</body>
</html>
